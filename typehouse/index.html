<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Typehouse" />
    <meta
      name="description"
      content="Night clerk of Habitat Grounds. We do not ask what they are. We ask which grounds."
    />
    <title>Typehouse — Habitat Grounds</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="top">
        <h1 id="title">TYPEHOUSE<small>HABITAT GROUNDS</small></h1>
        <div id="wallet">
          <div class="res tally"><span>TALLY</span><b id="tally">12</b></div>
          <div class="res scrap"><span>SCRAP</span><b id="scrap">6</b></div>
          <div class="res dust"><span>DUST</span><b id="dust">0</b></div>
        </div>
      </header>
      <div id="weather" hidden></div>
      <div id="house-wrap">
        <div id="park">
          <canvas id="grounds" aria-hidden="true"></canvas>
          <div id="house" aria-label="Habitat Grounds park"></div>
          <canvas id="critters" aria-hidden="true"></canvas>
          <div id="pips"></div>
        </div>
      </div>
      <div id="lobby-strip" hidden></div>
      <div id="blotter">The night desk is open.</div>
      <div id="context"><b>HABITAT GROUNDS</b> · tap a lot</div>
      <nav id="dock">
        <button type="button" id="btn-build">BUILD</button>
        <button type="button" id="btn-assign">ASSIGN</button>
        <button type="button" id="btn-help">?</button>
      </nav>
    </div>
    <div id="dim"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true">
      <div id="sheet-body"></div>
    </div>
    <div id="toast" hidden></div>
    <script src="js/data.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/game.js"></script>
    <script src="js/wander.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
